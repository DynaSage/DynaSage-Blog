<!-- index.html (save in templates folder) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>津波</title>
</head>
<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
    <form action="/bomb" method="post">
        <label for="phone">Phone No.</label>
        <input type="text" id="phone" name="phone" required pattern="\d{10}" title="10 digit phone number"><br><br>
        <label for="count">SMS Count</label>
        <input type="number" id="count" name="count" required min="1"><br><br>
        <input type="submit" value="Start Bombing">
    </form>
</body>
</html>
